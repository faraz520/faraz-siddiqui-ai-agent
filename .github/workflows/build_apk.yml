name: Flutter Android APK Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Restore Android platform structure
        shell: bash
        run: |
          set -e
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name faraz_siddiqui_ai_agent .
          fi

          mkdir -p android/app/src/main
          cp build.gradle android/app/build.gradle
          cp settings.gradle android/settings.gradle
          cp gradle.properties android/gradle.properties
          cp AndroidManifest.xml android/app/src/main/AndroidManifest.xml

          rm -rf android/app/src/main/kotlin
          mkdir -p android/app/src/main/kotlin/com/farazsiddiqui/aiagent
          cat > android/app/src/main/kotlin/com/farazsiddiqui/aiagent/MainActivity.kt <<'EOF'
          package com.farazsiddiqui.aiagent

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity : FlutterActivity()
          EOF

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --target lib/main.dart --dart-define=GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: faraz-siddiqui-ai-agent-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
