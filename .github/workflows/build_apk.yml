name: Flutter Android APK Build

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Proper Flutter Structure
        run: |
          # Create necessary flutter directories
          mkdir -p lib android/app
          
          # Move dart files to lib if they are in root
          mv *.dart lib/ 2>/dev/null || true
          
          # If build.gradle exists in root, move it to android/app/
          if [ -f "build.gradle" ]; then
            cp build.gradle android/app/
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release -t lib/main.dart

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: faraz-siddiqui-ai-agent-apk
          path: build/app/outputs/flutter-apk/app-release.apk
