name: Flutter Android APK Build

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Clean and Recreate Android Structure
        run: |
          mkdir -p lib
          for f in *.dart; do
            if [ -f "$f" ]; then
              cp "$f" lib/
            fi
          done
          rm -rf android
          flutter create . --org com.faraz.aiagent --platforms android --project-name faraz_siddiqui_ai_agent

      - name: Fix Gradle Repositories for Legacy Plugins
        run: |
          # Add mavenCentral / maven to allprojects so old packages like speech_to_text find jcenter alternatives
          if [ -f "android/build.gradle" ]; then
            echo "Allprojects repositories fixed"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release -t lib/main.dart --no-pub

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: faraz-siddiqui-ai-agent-apk
          path: build/app/outputs/flutter-apk/app-release.apk
