name: Flutter Android APK Build

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Clean and Recreate Android Structure
        run: |
          # Create lib folder if not exists
          mkdir -p lib
          
          # Move all root .dart files into lib folder safely
          for f in *.dart; do
            if [ -f "$f" ]; then
              cp "$f" lib/
            fi
          done
          
          # Remove old android folder with v1 embedding
          rm -rf android
          
          # Generate fresh v2 android embedding structure
          flutter create . --org com.faraz.aiagent --platforms android --project-name faraz_siddiqui_ai_agent

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release -t lib/main.dart

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: faraz-siddiqui-ai-agent-apk
          path: build/app/outputs/flutter-apk/app-release.apk
