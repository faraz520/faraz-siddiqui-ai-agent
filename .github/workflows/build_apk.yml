name: Faraz Siddiqui AI Agent - Android Release APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter 3.35.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          cache: true

      - name: Generate Android platform files when missing
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name faraz_siddiqui_ai_agent .
            rm -f test/widget_test.dart
          fi
          rm -f android/app/build.gradle.kts

      - name: Validate Android build inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f build.gradle
          test -f gradle.properties
          test -f AndroidManifest.xml
          test -f pubspec.yaml
          test -f lib/main.dart
          mkdir -p android/app/src/main
          cp build.gradle android/app/build.gradle
          cp gradle.properties android/gradle.properties
          cp AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/farazsiddiqui/aiagent
          cat > android/app/src/main/kotlin/com/farazsiddiqui/aiagent/MainActivity.kt <<'EOF'
          package com.farazsiddiqui.aiagent

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity : FlutterActivity()
          EOF
          cat >> android/build.gradle <<'EOF'

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android.compileSdkVersion 36
                  }
              }
          }
          EOF

      - name: Resolve Dart dependencies
        run: flutter pub get

      - name: Analyze application Dart sources
        run: flutter analyze lib

      - name: Build Android Release APK with Gradle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace app:assembleRelease

      - name: Verify APK integrity
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          file "$APK"
          unzip -t "$APK" >/dev/null
          ls -lh "$APK"
          mkdir -p release
          cp "$APK" release/Faraz_Siddiqui_AI_Agent_v1.0.0.apk

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Faraz-Siddiqui-AI-Agent-Release-APK
          path: release/Faraz_Siddiqui_AI_Agent_v1.0.0.apk
          if-no-files-found: error
          retention-days: 30
