name: Flutter Android APK Build

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Organize Project Structure
        run: |
          mkdir -p lib
          # Move all dart files from root to lib if they exist there
          find . -maxdepth 1 -name "*.dart" -exec cp {} lib/ \;
          # Create folders if referenced and move corresponding files if any
          mkdir -p lib/theme lib/screens lib/services
          if [ -f "app_theme.dart" ]; then cp app_theme.dart lib/theme/; fi
          if [ -f "chat_screen.dart" ]; then cp chat_screen.dart lib/screens/; fi
          if [ -f "settings_screen.dart" ]; then cp settings_screen.dart lib/screens/; fi

      - name: Build APK
        run: flutter build apk --release -t lib/main.dart

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: faraz-siddiqui-ai-agent-apk
          path: build/app/outputs/flutter-apk/app-release.apk
