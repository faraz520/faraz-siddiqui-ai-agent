name: faraz_siddiqui_ai_agent
description: "Faraz Siddiqui AI Agent - Permanent Personal Digital Assistant for HSE, Career, & Content Creation"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.0.0
  google_generative_ai: ^0.4.0
  speech_to_text: ^6.6.0
  flutter_tts: ^4.0.2
  shared_preferences: ^2.2.3
  file_picker: ^8.0.0
  camera: ^0.11.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  flutter_markdown: ^0.7.1
  path_provider: ^2.1.2
  share_plus: ^9.0.0
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
